<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-back-button defaultHref="/home"></ion-back-button>
    </ion-buttons>
    <ion-title>Aplicación 2</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true">
  <div class="container">
    <h1>Aplicación 2</h1>
    <p>Esta es la segunda aplicación de ejemplo.</p>
    
    <ion-card>
      <ion-card-header>
        <ion-card-title>Características</ion-card-title>
      </ion-card-header>
      <ion-card-content>
        <ion-list>
          <ion-item>
            <ion-icon name="star" slot="start" color="warning"></ion-icon>
            <ion-label>Componentes avanzados de PrimeNG</ion-label>
          </ion-item>
          <ion-item>
            <ion-icon name="star" slot="start" color="warning"></ion-icon>
            <ion-label>Librería compartida integrada</ion-label>
          </ion-item>
          <ion-item>
            <ion-icon name="star" slot="start" color="warning"></ion-icon>
            <ion-label>Ionic 8 con Angular 20</ion-label>
          </ion-item>
        </ion-list>
      </ion-card-content>
    </ion-card>

    <ion-button expand="block" color="secondary" (click)="openExternalApp()">
      <ion-icon name="rocket" slot="start"></ion-icon>
      Lanzar Aplicación Externa
    </ion-button>
  </div>
</ion-content>
